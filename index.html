<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The icon and title below are the lead360 build's. This file is static and
      cannot read VITE_CONSOLE_PRODUCT, so the `console-html-brand` plugin in
      vite.config.ts rewrites both at build time for the stylemint build.
      Keep the two tags on one line each — the plugin matches them by shape.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060911" />
    <title>Lead360</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
